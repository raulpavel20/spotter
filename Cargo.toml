[package]
name = "spotter-tui"
version = "0.1.0"
edition = "2024"
description = "A live, read-only terminal view of what changed on your branch, built for reviewing a coding agent's work"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/raulpavel20/spotter"
homepage = "https://github.com/raulpavel20/spotter"
readme = "README.md"
keywords = ["git", "tui", "review", "diff", "agent"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/target", "/assets"]

[lib]
name = "spotter"
path = "src/lib.rs"

[[bin]]
name = "spotter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bstr = "1.13.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2.7"
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-onig"] }
toml_edit = "0.25"
two-face = "0.5"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3

# Highlighting is the hot path in tests and debug builds.
[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.onig]
opt-level = 3

[profile.dev.package.onig_sys]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
